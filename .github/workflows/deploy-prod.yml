name: Deploy to Production

# IMPORTANT: Ce workflow est désactivé par défaut
# Pour l'activer, décommentez le bloc "on:" ci-dessous

# on:
#   push:
#     branches:
#       - master
#   workflow_dispatch:

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to atelier-sapi.fr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Temps 2 catalogue PDF : génère /vendor (mPDF) sur le runner avant le FTP.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install PHP dependencies (mPDF)
        run: composer update --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Deploy to O2Switch via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USERNAME_PROD }}
          password: ${{ secrets.FTP_PASSWORD_PROD }}
          port: 21
          server-dir: /wp-content/themes/theme-sapi-maison/
          local-dir: ./
          # ⚠️ EXCLUSIONS ÉLARGIES LE 28/08. Le thème embarque des documents de
          # travail — journal de coordination, maquettes, notes, exports CSV —
          # et le dossier du thème est servi tel quel par le serveur web : sans
          # ces lignes, n'importe qui peut lire
          # atelier-sapi.fr/wp-content/themes/theme-sapi-maison/memory/*.md.
          #
          # ⚠️ NE PAS AJOUTER `assets/*.txt`. Le workflow de test l'a, et c'est
          # un piège : `assets/guide-prompt-{ton,savoir,regles,exemples}.txt`
          # sont LUS À L'EXÉCUTION par sapi_megafilter_load_v2_prompts(). Les
          # exclure ne casse rien tant qu'ils sont déjà sur le serveur (le
          # déploiement FTP ne supprime pas ce qu'il ignore), mais sur une
          # installation neuve le Conseiller perdrait sa voix et ses règles
          # métier — en silence, `@file_get_contents` retombant sur ''.
          # `assets/*.html` en revanche n'est que de la documentation.
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**
            **/.vscode/**
            **/.idea/**
            .claude/**
            memory/**
            mockups/**
            *.md
            *.csv
            *.txt
            *.html
            assets/*.html
            .ftp-deploy-sync-state.json
